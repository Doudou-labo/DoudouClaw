name: Push Notification (Discord)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build payload
        id: payload
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF_NAME}"
          ACTOR="${{ github.actor }}"
          COMPARE_URL="${{ github.event.compare }}"
          HEAD_MSG="${{ github.event.head_commit.message }}"
          HEAD_URL="${{ github.event.head_commit.url }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          COUNT="${{ github.event.commits && github.event.commits.size || 1 }}"

          CONTENT="✅ **Push détecté**\n"
          CONTENT+="Repo: **${REPO}**\n"
          CONTENT+="Branche: **${BRANCH}**\n"
          CONTENT+="Auteur: **${ACTOR}**\n"
          CONTENT+="Commit: [${SHORT_SHA}](${HEAD_URL})\n"
          CONTENT+="Message: ${HEAD_MSG}\n"
          CONTENT+="Compare: ${COMPARE_URL}"

          jq -n --arg content "$CONTENT" '{content: $content}' > payload.json
          cat payload.json

      - name: Send Discord notification
        if: ${{ secrets.DISCORD_PUSH_WEBHOOK_URL != '' }}
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.DISCORD_PUSH_WEBHOOK_URL }}"

      - name: Missing webhook secret
        if: ${{ secrets.DISCORD_PUSH_WEBHOOK_URL == '' }}
        run: |
          echo "Secret DISCORD_PUSH_WEBHOOK_URL absent."
          echo "Ajoute un webhook Discord dans Settings > Secrets and variables > Actions."
