name: Push Notification (Discord)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_PUSH_WEBHOOK_URL: ${{ secrets.DISCORD_PUSH_WEBHOOK_URL }}
    steps:
      - name: Build payload
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF_NAME}"
          ACTOR="${{ github.actor }}"
          COMPARE_URL="${{ github.event.compare }}"
          HEAD_MSG="${{ github.event.head_commit.message }}"
          HEAD_URL="${{ github.event.head_commit.url }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          CONTENT="✅ **Push détecté**\n"
          CONTENT+="Repo: **${REPO}**\n"
          CONTENT+="Branche: **${BRANCH}**\n"
          CONTENT+="Auteur: **${ACTOR}**\n"
          CONTENT+="Commit: [${SHORT_SHA}](${HEAD_URL})\n"
          CONTENT+="Message: ${HEAD_MSG}\n"
          CONTENT+="Compare: ${COMPARE_URL}"

          jq -n --arg content "$CONTENT" '{content: $content}' > payload.json
          cat payload.json

      - name: Send Discord notification (if secret configured)
        run: |
          if [ -z "$DISCORD_PUSH_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_PUSH_WEBHOOK_URL absent."
            echo "Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 0
          fi

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_PUSH_WEBHOOK_URL"
