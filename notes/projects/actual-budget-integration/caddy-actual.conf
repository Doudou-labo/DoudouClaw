# ============================================================
# Bloc Caddy — Actual Budget
# Fichier à ajouter dans /etc/caddy/Caddyfile
#
# IMPORTANT : Remplacer MOT_DE_PASSE_CADDY par le mot de passe
# que tu veux pour l'accès basic auth à https://actual.doudougen.xyz
#
# Après modification, recharger Caddy :
#   sudo caddy reload --config /etc/caddy/Caddyfile
# ============================================================

actual.doudougen.xyz {
    reverse_proxy localhost:5006

    # Authentification basique HTTP
    # Remplace MOT_DE_PASSE_CADDY par un mot de passe robuste
    basic_auth {
        DoudouClaw MOT_DE_PASSE_CADDY
    }

    # Logs pour debug
    log {
        output file /var/log/caddy/actual-access.log
    }
}
