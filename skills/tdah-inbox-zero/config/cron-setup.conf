# Configuration Cron TDAH Inbox Zero
# Ajouté le : 2026-03-17

## Cron actif
0 8-20 * * * cd /root/.openclaw/workspace && bash skills/tdah-inbox-zero/scripts/tdah-reminder-check.sh >> /tmp/tdah-reminders.log 2>&1

## Fonctionnement
- Exécution : Toutes les heures de 8h à 20h
- Action : Parse le dashboard → Détecte les échéances → Envoie rappel
- Log : /tmp/tdah-reminders.log

## Migration prévue
Quotas API disponibles (semaine prochaine) :
→ Migrer vers n8n + Google Calendar
→ Plus besoin de ce cron, les événements seront dans Google Calendar avec notifs natives
