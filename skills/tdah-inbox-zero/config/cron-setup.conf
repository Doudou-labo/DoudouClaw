# Configuration Cron Inbox Zero
# Ajouté le : 2026-03-17
# Mis à jour : 2026-03-17 (intégration Google Calendar active)

## Cron actif
0 8-20 * * * cd /root/.openclaw/workspace && bash skills/tdah-inbox-zero/scripts/tdah-reminder-check.sh >> /tmp/inbox-zero-reminders.log 2>&1

## Fonctionnement
- Exécution : Toutes les heures de 8h à 20h
- Action : Parse le dashboard → Détecte les échéances → Envoie rappel
- Log : /tmp/inbox-zero-reminders.log

## Google Calendar sync
- Script : `skills/tdah-inbox-zero/scripts/sync-to-google-calendar.sh`
- API : Maton Gateway (token dans le script)
- Calendrier : OpenClaw
- Blocs Gros Morceaux : 30 min travail + 10 min pause + pause déjeuner 45 min
- Anti-doublons : marqueur [S] dans le dashboard
